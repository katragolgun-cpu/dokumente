<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dokumente</title>
<meta name="theme-color" content="#24524a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Layout: mobile-first Ablage – Suche oben, Fristen-Leiste, Filter-Chips, Karten je Brief; Bottom-Sheet für Erfassen und Ansicht */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --sunken:#e7e9e4; --line:#d6dad2;
  --ink:#1b2420; --muted:#5d6a63;
  --accent:#24524a; --accent-ink:#ffffff;
  --ok:#1f7a45; --ok-soft:#dcefe3;
  --warn:#9a5b00; --warn-soft:#f7ead2;
  --bad:#b0322b; --bad-soft:#f6dedc;
  --wait:#3e5a9a; --wait-soft:#dfe6f5;
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:ui-monospace,"Roboto Mono","SFMono-Regular",Consolas,monospace;
  --r:16px; --shadow:0 1px 2px rgba(20,36,30,.06),0 4px 14px rgba(20,36,30,.06); color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#101614; --surface:#18211e; --sunken:#202b27; --line:#2d3a35;
  --ink:#e5ece8; --muted:#93a39b; --accent:#8cc9b9; --accent-ink:#0d2620;
  --ok:#5cc489; --ok-soft:#173326; --warn:#e2a54a; --warn-soft:#3a2c14;
  --bad:#f0827a; --bad-soft:#3d1d1b; --wait:#8fa9e6; --wait-soft:#1e2a45; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
header.top h1{font-size:26px;margin:0;font-weight:700;letter-spacing:-.02em}
header.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.iconbtn{position:relative;border:0;background:var(--surface);box-shadow:var(--shadow);color:var(--ink);border-radius:12px;padding:9px 10px;font:inherit;display:flex;align-items:center}
.iconbtn svg{width:20px;height:20px}
.dot{position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:var(--warn);border:2px solid var(--bg)}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:12px 40px 12px 40px;border:0;border-radius:14px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:4px 8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--surface);box-shadow:var(--shadow);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:13.5px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip .c{font-family:var(--f-num);font-size:12px;opacity:.7;margin-left:4px}
.due-box{background:linear-gradient(135deg,#24524a,#173a34);color:#fff;border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
@media (prefers-color-scheme: dark){.due-box{background:linear-gradient(135deg,#1d4740,#10302a)}}
.due-box h2{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.due-item{display:flex;justify-content:space-between;gap:10px;align-items:center;border:0;background:rgba(255,255,255,.1);color:inherit;font:inherit;text-align:left;border-radius:12px;padding:9px 12px;width:100%}
.due-item .t{font-weight:600;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.due-item .s{font-size:12.5px;opacity:.85}
.due-item .d{font-family:var(--f-num);font-size:13px;white-space:nowrap;font-weight:600}
.due-item.over .d{color:#ffc7c2}
.list{display:flex;flex-direction:column;gap:10px}
.grp{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--sunken);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;font-size:14.5px;font-weight:600;text-align:left;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;margin-top:4px}
.grp .chev{flex:none;width:16px;height:16px;transition:transform .15s;color:var(--muted)}
.grp[aria-expanded="true"] .chev{transform:rotate(90deg)}
.grp .gn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp .c{font-family:var(--f-num);font-size:12.5px;color:var(--muted);font-weight:500}
.grp.allsel{box-shadow:0 0 0 2px var(--accent)}
.chips .lbl{flex:none;align-self:center;font-size:12.5px;color:var(--muted);padding-left:2px}
/* Filter: Knopf neben der Suche, Panel von unten */
.srow{display:flex;gap:8px;align-items:stretch}
.srow .search{flex:1;min-width:0}
.srow .iconbtn{border-radius:14px;padding:0 13px}
.srow .iconbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.fbadge{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:700 11.5px/19px var(--f-num);text-align:center;border:2px solid var(--bg)}
.chips.act{margin-top:-4px;flex-wrap:wrap;overflow:visible}
.chip.on{background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:2px;padding-right:8px}
.chip.on .x{font-size:17px;line-height:1;opacity:.75;padding:0 2px 0 6px}
.chip.plain{padding-right:14px;background:var(--surface);color:var(--ink)}
.chips.fwrap{flex-wrap:wrap;overflow:visible}
.fsec h3{margin:0 0 2px}
.year{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-top:6px}
.card{background:var(--surface);border:0;box-shadow:var(--shadow);border-radius:var(--r);padding:13px 15px;display:flex;gap:12px;text-align:left;font:inherit;color:inherit;width:100%;align-items:flex-start}
.card:active{transform:scale(.99)}
.card .th{flex:none;width:46px;height:60px;border-radius:6px;background:var(--sunken);object-fit:cover;object-position:top;border:1px solid var(--line)}
.card .th.ph{display:grid;place-items:center;color:var(--muted)}
.card .th.ph svg{width:22px;height:22px}
.card .body{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.card .r1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .snd{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.card .dt{font-family:var(--f-num);font-size:12.5px;color:var(--muted);white-space:nowrap}
.card .sbj{font-size:14px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:3px}
.card .hit{font-size:12.5px;color:var(--muted);background:var(--sunken);border-radius:8px;padding:5px 8px;margin-top:3px}
.card .hit mark{background:var(--warn-soft);color:var(--ink);border-radius:3px;padding:0 1px}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunken);color:var(--ink)}
.stamp{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:6px;border:1.5px solid currentColor;white-space:nowrap}
.s-neu{color:var(--wait);background:var(--wait-soft)} .s-todo{color:var(--warn);background:var(--warn-soft)} .s-ok{color:var(--ok);background:var(--ok-soft)} .s-bad{color:var(--bad);background:var(--bad-soft)}
.empty{background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r);padding:24px 16px;text-align:center;color:var(--muted)}
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(22px + env(safe-area-inset-bottom,0px));height:58px;display:flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:29px;padding:0 22px 0 18px;box-shadow:0 6px 20px rgba(0,0,0,.22);z-index:7;font:inherit;font-weight:700;font-size:15px}
.fab svg{width:24px;height:24px}
/* Mehrfachauswahl */
.card{position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.card.sel{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.card .ck{position:absolute;top:7px;left:7px;width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);background:var(--surface);display:grid;place-items:center;font-size:13px;font-weight:700;color:transparent}
.card.sel .ck{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);box-shadow:0 -4px 18px rgba(0,0,0,.15);border-radius:18px 18px 0 0;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.selbar .in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.selhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.selacts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.selacts .btn{padding:10px 4px;font-weight:600;font-size:13.5px}
body.selmode .toast{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
.optlist{display:flex;flex-direction:column;gap:8px}
.optlist .btn{text-align:left;padding:12px 14px;font-size:15px}
.optlist .btn small{display:block;color:var(--muted);font-size:12.5px;font-weight:400;margin-top:2px}
.scrim{position:fixed;inset:0;background:rgba(10,18,15,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:94%;overflow-y:auto;border-radius:18px 18px 0 0;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-head{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0 10px;z-index:2;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sheet-head h2{margin:0;font-size:18px;min-width:0;overflow-wrap:break-word}
.sec{background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r);padding:14px;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.sec h3{margin:0;font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.hero .snd{font-size:13px;color:var(--muted);font-weight:600}
.hero .sbj{font-size:19px;font-weight:700;line-height:1.3}
.summary{white-space:pre-line;font-size:14.5px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px}
.kv .k{color:var(--muted);font-size:13px}
.kv .v{overflow-wrap:anywhere}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 6px;font:inherit;font-size:14px;font-weight:600}
.seg button[aria-pressed="true"].neu{background:var(--wait-soft);color:var(--wait);border-color:var(--wait)}
.seg button[aria-pressed="true"].todo{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.seg button[aria-pressed="true"].erledigt{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
label.f.full{grid-column:1/-1}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-width:0}
textarea{resize:vertical;font-size:15px}
textarea.mono{font-family:var(--f-num);font-size:12.5px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 13px;font:inherit;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.link{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 0}
.btn[disabled]{opacity:.55}
.status{font-size:13.5px;color:var(--muted)} .status.err{color:var(--bad)}
.hint{background:var(--warn-soft);color:var(--warn);border-radius:9px;padding:8px 10px;font-size:13.5px}
.tagedit{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tagedit .tag{display:inline-flex;align-items:center;gap:4px;padding:4px 6px 4px 10px;font-size:13px}
.tagedit .tag button{border:0;background:none;color:var(--muted);font-size:16px;line-height:1;padding:0 2px}
.tagedit input{flex:1;min-width:120px;padding:6px 8px;font-size:15px}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{border:1px dashed var(--line);background:none;color:var(--muted);border-radius:999px;padding:3px 10px;font:inherit;font-size:12.5px}
.thumb{width:100%;max-height:260px;object-fit:cover;object-position:top;border-radius:10px;border:1px solid var(--line);background:#fff;display:block}
.zoomable{position:relative;border:0;padding:0;background:none;display:block;width:100%;cursor:zoom-in}
.zoomable .zl{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.65);color:#fff;font-size:12.5px;font-weight:600;border-radius:999px;padding:5px 10px;display:flex;align-items:center;gap:5px}
.zoomable .zl svg{width:14px;height:14px}
#viewerHost .vw{position:fixed;inset:0;z-index:60;background:#111;display:flex;flex-direction:column}
#viewerHost .vbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;background:#1c1c1c;color:#fff}
#viewerHost .vbar .btn{background:#2c2c2c;color:#fff;border-color:#444;min-width:44px}
#viewerHost .vbar .pct{font-family:var(--f-num);font-size:13px;min-width:48px;text-align:center}
#viewerHost .vscroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom}
#viewerHost .vpages{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px;box-sizing:border-box}
#viewerHost .vpages img{display:block;background:#fff;max-width:none;height:auto;box-shadow:0 2px 10px rgba(0,0,0,.5)}
#viewerHost .vpg{position:relative;display:block}
#viewerHost .vtx{position:absolute;inset:0;user-select:text;-webkit-user-select:text;-webkit-touch-callout:default}
#viewerHost .vtx div{position:absolute;white-space:pre;color:transparent;transform-origin:0 0;line-height:1;font-family:Arial,sans-serif;cursor:text}
#viewerHost .vtx ::selection{background:rgba(30,120,255,.4);color:transparent}
#viewerHost .vmsg{color:#ccc;text-align:center;padding:40px 16px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:40;max-width:90%}
.scanwrap{display:flex;justify-content:center;margin:12px 0}
.scanwrap canvas{touch-action:none;border-radius:8px;max-width:100%;background:#000}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.thumbs .pg{display:flex;flex-direction:column;align-items:center;gap:2px}
.thumbs img{width:84px;height:118px;object-fit:cover;border:1px solid var(--line);border-radius:6px;background:#fff}
.catrow{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.catrow:last-of-type{border-bottom:0}
details summary{cursor:pointer}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>

<div class="wrap">
  <header class="top">
    <div><h1>Dokumente</h1><p id="sub">Briefe erfassen und wiederfinden</p></div>
    <button class="iconbtn" id="btnSettings" type="button" aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span class="dot" id="settingsDot" hidden></span></button>
  </header>
  <div class="srow"><div class="search" role="search"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input type="text" inputmode="search" id="q" placeholder="Suchen: Absender, Schlagwort, Text, Aktenzeichen" aria-label="Dokumente durchsuchen" autocomplete="off" enterkeyhint="search"><button type="button" id="qClear" aria-label="Suche leeren" hidden>×</button></div>
  <button class="iconbtn" id="btnFilter" type="button" aria-label="Filter" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg><span class="fbadge" id="fBadge" hidden></span></button></div>

  <section id="dueBox" class="due-box" hidden></section>
  <nav class="chips act" id="actChips" aria-label="Aktive Filter"></nav>

</div>
<button class="fab" id="btnAdd" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M8 12h8"/></svg>Brief erfassen</button>
<div class="selbar" id="selBar" hidden><div class="in">
  <div class="selhead"><button type="button" class="btn link" data-sel="cancel">Abbrechen</button><span id="selCount">0 ausgewählt</span><button type="button" class="btn link" data-sel="all" id="selAll">Alle</button></div>

</div></div>
<input type="file" id="pick" accept="image/*,application/pdf" hidden>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>

<div id="viewerHost"></div>

<script>
"use strict";
/* ================= Speicher (IndexedDB, nur auf diesem Gerät) ================= */
const DB_NAME="dokumente",DB_VER=1;
let _db;
function idb(){
  if(_db)return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=()=>{const d=r.result;
      if(!d.objectStoreNames.contains("docs"))d.createObjectStore("docs",{keyPath:"id"});

function hay(d){return fold([d.sender,d.subject,d.category,(d.tags||[]).join(" "),d.summary,d.refLabel,d.ref,d.note,dfmt(d.letterDate),d.letterDate,d.deadline&&dfmt(d.deadline),d.amount!=null?String(d.amount).replace(".",","):"",d.text].join(" \n "))}
function matchQ(d,q){
  const words=fold(q).split(/\s+/).filter(Boolean);if(!words.length)return true;
  const h=hay(d),hc=h.replace(/[^a-z0-9]/g,"");
  return words.every(w=>h.includes(w)||(w.replace(/[^a-z0-9]/g,"").length>=4&&hc.includes(w.replace(/[^a-z0-9]/g,""))));
}
// Textstelle mit dem ersten Treffer zeigen (nur wenn der Treffer im erkannten Text liegt)
function snippet(d,q){
  const w=fold(q).split(/\s+/).filter(Boolean)[0];if(!w||!d.text)return "";
  const meta=fold([d.sender,d.subject,(d.tags||[]).join(" "),d.category].join(" "));if(meta.includes(w))return "";
  const t=d.text.replace(/\s+/g," "),ft=fold(t);const i=ft.indexOf(w);if(i<0)return "";
  // fold verändert die Länge (ä->ae): Position grob zurückrechnen
  let pos=0,acc=0;while(pos<t.length&&acc<i){acc+=fold(t[pos]).length;pos++}
  const a=Math.max(0,pos-50),b=Math.min(t.length,pos+w.length+70);
  let len=0,k=pos;while(k<t.length&&len<w.length){len+=fold(t[k]).length;k++}
  return (a>0?"… ":"")+esc(t.slice(a,pos))+"<mark>"+esc(t.slice(pos,k))+"</mark>"+esc(t.slice(k,b))+(b<t.length?" …":"");
}

}

const GROUPS=[["keine","Keine"],["kategorie","Kategorie"],["absender","Absender"],["jahr","Jahr"],["status","Status"]];

function saveGrp(){try{localStorage.setItem("grp",JSON.stringify({mode:S.group,open:S.open}))}catch{}}
// Absender grob vereinheitlichen: Groß-/Kleinschreibung, Satzzeichen, Rechtsformen ignorieren
const LEGAL=new Set(["gmbh","mbh","ag","kg","kgaa","ohg","gbr","ug","se","ev","eg","co","und","haftungsbeschraenkt","vvag","ltd","inc"]);
function senderTokens(n){return fold(n).replace(/e\.\s*v\./g," ev ").replace(/&/g," und ").split(/[^a-z0-9]+/).filter(t=>t&&!LEGAL.has(t))}
function senderGroups(rows){
  const keyOf=new Map(),toks=new Map();
  for(const d of rows){const t=senderTokens(d.sender||"");const k=t.join(" ");keyOf.set(d.id,k);if(k)toks.set(k,t)}
  // kürzere Schreibweise, die am Wortanfang übereinstimmt, übernimmt die längere (HUK-COBURG ⊂ HUK Coburg Versicherung)
  const keys=[...toks.keys()].sort((a,b)=>toks.get(a).length-toks.get(b).length||a.length-b.length),root=new Map();
  for(const k of keys){const t=toks.get(k);let r=k;
    for(const c of keys){const ct=toks.get(c);if(c===k||ct.length>=t.length||ct.join("").length<4)continue;if(ct.every((w,i)=>t[i]===w)){r=root.get(c)||c;break}}
    root.set(k,r)}
  const names=new Map();
  for(const d of rows){const k=keyOf.get(d.id);if(!k)continue;const r=root.get(k);const m=names.get(r)||new Map();const n=(d.sender||"").trim();m.set(n,(m.get(n)||0)+1);names.set(r,m)}
  const label=r=>[...names.get(r)].sort((a,b)=>b[1]-a[1]||a[0].length-b[0].length||(a[0]===a[0].toLowerCase())-(b[0]===b[0].toLowerCase()))[0][0];
  return d=>{const k=keyOf.get(d.id);if(!k)return {key:"",name:"Unbekannter Absender"};const r=root.get(k);return {key:r,name:label(r)}};
}
function groupRows(rows){
  const m=S.group;let gf,order;
  if(m==="kategorie"){gf=d=>({key:d.category||"",name:d.category||"Ohne Kategorie"});order=(a,b)=>!a.key-!b.key||a.name.localeCompare(b.name,"de")}
  else if(m==="absender"){gf=senderGroups(rows);order=(a,b)=>!a.key-!b.key||a.name.localeCompare(b.name,"de",{sensitivity:"base"})}
  else if(m==="jahr"){gf=d=>{const y=docDate(d).slice(0,4);return {key:y,name:y}};order=(a,b)=>b.key.localeCompare(a.key)}
  else if(m==="status"){const o=["neu","todo","erledigt"];gf=d=>{const k=STATUS[d.status]?d.status:"neu";return {key:k,name:STATUS[k]}};order=(a,b)=>o.indexOf(a.key)-o.indexOf(b.key)}
  const map=new Map();
  for(const d of rows){const g=gf(d);if(!map.has(g.key))map.set(g.key,{...g,docs:[]});map.get(g.key).docs.push(d)}
  return [...map.values()].sort(order);
}

function render(){
  if(!S.loaded)return;

  $("#sub").textContent=all.length?`${all.length} Dokument${all.length===1?"":"e"}${S.settings.driveLinked?" · in Google Drive":""}`:"Briefe erfassen und wiederfinden";

  S.shown=rows.map(d=>d.id);
  if(S.sel){const ids=new Set(all.map(d=>d.id));for(const id of [...S.sel])if(!ids.has(id))S.sel.delete(id)}
  updateSelBar();
  const list=$("#list");

async function shrink(file,max,q){
  if(!file.type.startsWith("image/"))return file;
  try{const bmp=await createImageBitmap(file);const sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const cv=document.createElement("canvas");cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);
    cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
    return await new Promise(res=>cv.toBlob(b=>res(b||file),"image/jpeg",q));}catch{return file}
}
async function makeThumb(img){
  try{const bmp=await createImageBitmap(img);const sc=Math.min(1,560/Math.max(bmp.width,bmp.height));
    const cv=document.createElement("canvas");cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);
    const g=cv.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,cv.width,cv.height);g.drawImage(bmp,0,0,cv.width,cv.height);
    return await new Promise(r=>cv.toBlob(r,"image/jpeg",0.7));}catch{return null}
}
async function pdfThumb(file){
  try{await loadLib(PDFJS,()=>!!window.pdfjsLib);
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
    const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;const page=await pdf.getPage(1);
    const vp0=page.getViewport({scale:1}),vp=page.getViewport({scale:700/Math.max(vp0.width,vp0.height)});
    const cv=document.createElement("canvas");cv.width=vp.width;cv.height=vp.height;await page.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
    return await new Promise(r=>cv.toBlob(r,"image/jpeg",0.7));}catch{return null}
}
async function openLocalFile(d){
  const f=d.fileId&&await dbGet("files",d.fileId);
  if(f){const u=URL.createObjectURL(f.blob);window.open(u,"_blank");setTimeout(()=>URL.revokeObjectURL(u),60000);return}
  if(d.url){window.open(d.url,"_blank");return}
  toast("Datei ist auf diesem Gerät nicht vorhanden.");
}
async function shareDoc(d){
  let f=d.fileId&&await dbGet("files",d.fileId);
  if(!f&&d.driveId){const b=await driveBlob(d.driveId);if(b)f={blob:b}}
  if(!f){toast("Datei nicht verfügbar.");return}
  const file=new File([f.blob],d.name||fileName(d),{type:"application/pdf"});
  if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:d.subject||"Dokument"})}catch{}}
  else{const u=URL.createObjectURL(f.blob);const a=document.createElement("a");a.href=u;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)}
}

/* ================= Texterkennung: Qualität prüfen, bei Zeichensalat gedrehte Varianten versuchen ================= */
const isImg=f=>/^image\//.test(f.type||"")||/\.(png|jpe?g|webp|heic|gif|bmp)$/i.test(f.name||"");
// Anteil echter Wörter: Buchstabenfolgen ab 3 Zeichen mit Vokal, an allen Textstücken
function ocrQuality(t){
  const toks=String(t||"").split(/\s+/).filter(x=>x.length>=2);if(toks.length<5)return 0;
  const good=toks.filter(x=>/^[(„"]?[A-Za-zÄÖÜäöüß][a-zäöüß-]{2,}[.,:;)"“]?$/.test(x)&&/[aeiouäöüy]/i.test(x)).length;
  return good/toks.length;
}
async function rotateBlob(blob,deg){
  const bmp=await createImageBitmap(blob);const sw=deg%180!==0;
  const cv=document.createElement("canvas");cv.width=sw?bmp.height:bmp.width;cv.height=sw?bmp.width:bmp.height;
  const g=cv.getContext("2d");g.translate(cv.width/2,cv.height/2);g.rotate(deg*Math.PI/180);g.drawImage(bmp,-bmp.width/2,-bmp.height/2);
  return await new Promise(r=>cv.toBlob(r,"image/png"));
}
async function ocrBest(img){
  let best={t:await tessRec(img)};best.q=ocrQuality(best.t);
  if(best.q>=0.45)return best.t;
  for(const deg of [90,270,180]){
    setStatus?.(`Text schlecht lesbar – versuche gedrehtes Bild (${deg}°) …`);
    try{const t=await tessRec(await rotateBlob(img,deg)),q=ocrQuality(t);if(q>best.q)best={t,q};if(q>=0.6)break}catch{}
  }
  return best.t;
}

/* ================= Großansicht (Fotos und PDF-Seiten, mit Zoom) ================= */
const V={zoom:1,urls:[],open:false,pages:[],textOn:false,key:null,cache:new Map(),busy:false};
async function docBlob(d){
  const f=d.fileId&&await dbGet("files",d.fileId).catch(()=>null);if(f?.blob)return f.blob;
  if(d.driveId)return await driveBlob(d.driveId);
  return null;
}
async function viewerPages(src,onPage){
  let b=src.blob;
  if(src.images?.length)return src.images;
  if(src.doc)b=await docBlob(src.doc);
  if(!b)return [];
  if(b.type?.startsWith("image/"))return [b];
  await loadLib(PDFJS,()=>!!window.pdfjsLib);
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await b.arrayBuffer())}).promise;const out=[];
  for(let i=1;i<=Math.min(pdf.numPages,30);i++){
    const page=await pdf.getPage(i),vp0=page.getViewport({scale:1}),vp=page.getViewport({scale:Math.min(3,1800/vp0.width)});
    const cv=document.createElement("canvas");cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);
    const g=cv.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,cv.width,cv.height);
    await page.render({canvasContext:g,viewport:vp}).promise;
    const blob=await new Promise(r=>cv.toBlob(r,"image/jpeg",0.88));out.push(blob);onPage?.(blob,i,pdf.numPages);
  }
  return out;
}
function closeViewer(fromPop){
  if(!V.open)return;V.open=false;V.urls.forEach(u=>URL.revokeObjectURL(u));V.urls=[];$("#viewerHost").innerHTML="";
  if(!fromPop&&history.state?.viewer)history.back();
}
function viewerZoom(z,keepCenter=true){
  const sc=$("#vScroll");if(!sc)return;
  const old=V.zoom;z=Math.max(1,Math.min(5,Math.round(z*4)/4));if(z===old)return;
  const cx=(sc.scrollLeft+sc.clientWidth/2)/sc.scrollWidth,cy=(sc.scrollTop+sc.clientHeight/2)/sc.scrollHeight;
  V.zoom=z;applyZoom();
  if(keepCenter){sc.scrollLeft=cx*sc.scrollWidth-sc.clientWidth/2;sc.scrollTop=cy*sc.scrollHeight-sc.clientHeight/2}
}
// Textebene: Texterkennung der angezeigten Seiten, unsichtbarer Text über dem Bild zum Markieren und Kopieren
async function viewerText(){
  const btn=$("#vTextBtn");
  if(V.textOn){V.textOn=false;V.pages.forEach(p=>p.pg.querySelector(".vtx")?.remove());if(btn)btn.textContent="Text markieren";return}
  if(V.busy||!V.pages.length)return;V.busy=true;
  try{
    const cached=V.key&&V.cache.get(V.key);let all=cached||[];
    if(!cached){
      if(btn)btn.textContent="Wird geladen …";await ensureTess();
      for(let i=0;i<V.pages.length;i++){
        if(!V.open)return;if(btn)btn.textContent=`Text wird erkannt (Seite ${i+1}/${V.pages.length}) …`;
        const res=await tessWorker.recognize(V.pages[i].blob,{},{text:true,blocks:true}),d=res?.data||{};
        let lines=d.lines;if(!lines?.length&&d.blocks)lines=d.blocks.flatMap(b=>(b.paragraphs||[]).flatMap(p=>p.lines||[]));
        all.push((lines||[]).map(l=>({t:(l.text||"").replace(/\s+$/,""),b:l.bbox})).filter(l=>l.t&&l.b));
      }
      if(V.key)V.cache.set(V.key,all);
    }
    if(!V.open)return;
    V.pages.forEach((p,i)=>{p.pg.querySelector(".vtx")?.remove();const L=document.createElement("div");L.className="vtx";
      for(const l of all[i]||[]){const e=document.createElement("div");e.textContent=l.t+"\n";e._b=l.b;L.appendChild(e)}
      p.pg.appendChild(L)});
    V.textOn=true;if(btn)btn.textContent="Text ausblenden";layoutText();
    toast(all.some(x=>x.length)?"Text lange drücken zum Markieren":"Kein Text erkannt");
  }catch(err){if(btn)btn.textContent="Text markieren";toast("Texterkennung nicht möglich (offline?)")}
  finally{V.busy=false;setStatus?.("")}
}
function layoutText(){
  if(!V.textOn)return;
  for(const p of V.pages){const L=p.pg.querySelector(".vtx");if(!L||!p.im.naturalWidth)continue;const s=p.im.clientWidth/p.im.naturalWidth;
    for(const e of L.children){const b=e._b,h=(b.y1-b.y0)*s,w=(b.x1-b.x0)*s;
      e.style.left=b.x0*s+"px";e.style.top=b.y0*s+"px";e.style.fontSize=Math.max(4,h*0.9)+"px";e.style.height=h+"px";e.style.transform="none";
      const mw=e.scrollWidth||1;e.style.transform=`scaleX(${(w/mw).toFixed(3)})`}}
}
function applyZoom(){
  const sc=$("#vScroll");if(!sc)return;const w=sc.clientWidth-20;
  sc.querySelectorAll(".vpages img").forEach(im=>im.style.width=Math.round(w*V.zoom)+"px");
  layoutText();
  const pc=$("#vPct");if(pc)pc.textContent=Math.round(V.zoom*100)+" %";
}
async function openViewer(src){
  if(src.doc&&!src.doc.fileId&&!src.doc.driveId&&src.doc.url){window.open(src.doc.url,"_blank");return}
  V.zoom=1;V.open=true;V.pages=[];V.textOn=false;V.key=src.doc?.id||null;
  $("#viewerHost").innerHTML=`<div class="vw" role="dialog" aria-modal="true" aria-label="Großansicht">
    <div class="vbar"><button type="button" class="btn" data-v="close">Schließen</button><button type="button" class="btn" data-v="text" id="vTextBtn">Text markieren</button>
      <div class="btnrow" style="align-items:center;gap:6px"><button type="button" class="btn" data-v="out" aria-label="Verkleinern">−</button><span class="pct" id="vPct">100 %</span><button type="button" class="btn" data-v="in" aria-label="Vergrößern">+</button></div></div>
    <div class="vscroll" id="vScroll"><div class="vpages" id="vPages"><div class="vmsg">Wird geladen …</div></div></div></div>`;
  try{history.pushState({viewer:1},"")}catch{}
  const host=$("#viewerHost");
  host.querySelector(".vbar").addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(!b)return;
    if(b.dataset.v==="close")return closeViewer();if(b.dataset.v==="text")return viewerText();if(b.dataset.v==="in")return viewerZoom(V.zoom+0.5);if(b.dataset.v==="out")return viewerZoom(V.zoom-0.5)});
  // Doppeltippen: Stelle vergrößern bzw. zurück auf ganze Breite
  $("#vScroll").addEventListener("dblclick",e=>{const img=e.target.closest("img");if(!img)return;
    const sc=$("#vScroll"),r=img.getBoundingClientRect(),fx=(e.clientX-r.left)/r.width,fy=(e.clientY-r.top)/r.height,top=img.offsetTop;
    const z=V.zoom>1?1:2.5;V.zoom=z;applyZoom();
    if(z>1){sc.scrollLeft=fx*img.offsetWidth+img.offsetLeft-sc.clientWidth/2;sc.scrollTop=img.offsetTop+fy*img.offsetHeight-sc.clientHeight/2}else sc.scrollTop=top-10});
  const box=$("#vPages");let first=true;
  const add=blob=>{if(!V.open)return;if(first){box.innerHTML="";first=false}const u=URL.createObjectURL(blob);V.urls.push(u);
    const pg=document.createElement("div");pg.className="vpg";const im=new Image();im.src=u;im.alt="Seite";im.onload=applyZoom;pg.appendChild(im);box.appendChild(pg);V.pages.push({blob,pg,im});applyZoom()};
  try{
    const pages=await viewerPages(src,add);
    if(!V.open)return;
    if(first){if(pages.length)pages.forEach(add);else box.innerHTML=`<div class="vmsg">Die Datei ist auf diesem Gerät nicht vorhanden${src.doc?.driveId?" und Google Drive ist gerade nicht erreichbar":""}.</div>`}
  }catch{if(V.open)box.innerHTML=`<div class="vmsg">Anzeige nicht möglich (offline?).</div>`}
}
window.addEventListener("popstate",()=>{if(V.open)closeViewer(true)});
window.addEventListener("resize",()=>{if(V.open)applyZoom()});

async function startCapture(){
  const r=await scanDocument("Brief erfassen");if(!r)return;
  openNew(r);
}
function knownTags(){const m=new Map();for(const d of live())for(const t of d.tags||[])m.set(fold(t),t);return [...m.values()]}
function knownSenders(){return [...new Set(live().map(d=>d.sender).filter(Boolean))]}
function blankDoc(){return {id:uid(),createdAt:new Date().toISOString(),updatedAt:null,letterDate:"",sender:"",subject:"",category:"",tags:[],summary:"",ref:"",refLabel:"",amount:null,deadline:"",deadlineKind:"",status:"neu",note:"",text:"",pages:0}}
async function openNew(input){
  const d=blankDoc();
  S.edit={mode:"new",doc:d,input,urls:[],auto:true,est:false};
  // Datei vorbereiten: PDF für die Ablage, Vorschaubild
  let pdf=input.pdf||null,first=input.images?.[0]||null;
  if(!pdf&&input.file){pdf=input.file.type==="application/pdf"||/\.pdf$/i.test(input.file.name||"")?input.file:await toPdf(input.file);if(input.file.type?.startsWith("image/"))first=input.file}
  S.edit.pdf=pdf;d.pages=input.images?.length||1;
  const th=first?await makeThumb(first):await pdfThumb(pdf);
  S.edit.thumb=th;if(th){const u=URL.createObjectURL(th);S.edit.urls.push(u);S.edit.thumbUrl=u}
  drawEditor();
  runOcr(input);
}
function openEdit(d){S.edit={mode:"edit",doc:structuredClone(d),urls:[],auto:false};drawEditor()}

function readForm(){
  const d=S.edit.doc,v=id=>$("#"+id)?.value??"";
  d.sender=v("f_sender").trim();d.subject=v("f_subject").trim();d.letterDate=v("f_date");d.category=v("f_cat");
  d.ref=v("f_ref").trim();const a=v("f_amount").trim().replace(/\s|€/g,"");d.amount=a?(+(/,/.test(a)?a.replace(/\./g,"").replace(",","."):a)||null):null;
  if(d.ref&&!d.refLabel)d.refLabel="Aktenzeichen";if(!d.ref)d.refLabel="";
  d.deadline=v("f_deadline");d.deadlineKind=v("f_dlkind").trim();d.summary=v("f_summary");d.note=v("f_note").trim();
  if($("#f_text"))d.text=v("f_text");
}
function addTagFromInput(){
  const inp=$("#tagIn");if(!inp)return;const t=inp.value.replace(/,/g," ").trim();if(!t)return;
  readForm();const d=S.edit.doc;if(!d.tags.some(x=>fold(x)===fold(t)))d.tags.push(t);inp.value="";drawEditor();$("#tagIn")?.focus();
}
function summaryFromFields(d){
  return Letter.buildSummary({sender:d.sender,subject:d.subject,date:d.letterDate,keySentence:S.edit?.key||null,deadline:d.deadline||null,deadlineKind:d.deadlineKind||"Frist",
    deadlineEstimated:!!S.edit?.est&&!!d.deadline,amount:d.amount,amountKind:S.edit?.amountKind||null,ref:d.ref?{label:d.refLabel||"Aktenzeichen",value:d.ref}:null});
}
function applyParsed(p,force){
  const d=S.edit.doc,set=(k,v)=>{if(v!=null&&v!==""&&(force||!d[k]))d[k]=v};
  set("letterDate",p.date);set("sender",p.sender);set("subject",p.subject);
  if(p.ref){if(force||!d.ref){d.ref=p.ref.value;d.refLabel=p.ref.label}}
  if(p.amount!=null&&(force||d.amount==null))d.amount=p.amount;
  if(p.deadline&&(force||!d.deadline)){d.deadline=p.deadline;d.deadlineKind=p.deadlineKind;S.edit.est=p.deadlineEstimated}
  if(p.category&&(force||!d.category))d.category=p.category;
  for(const t of p.tags||[])if(!d.tags.some(x=>fold(x)===fold(t)))d.tags.push(t);
  S.edit.key=p.keySentence;S.edit.amountKind=p.amountKind;
  if(force||!d.summary)d.summary=p.summary;
  if(d.deadline&&d.status==="neu")d.status="todo";
}
function parseCtx(){return {today:today(),categories:S.settings.categories,senders:knownSenders(),tags:knownTags()}}
async function runOcr(input){
  const E=S.edit;E.ocrBusy=true;E.ocrMsg="Texterkennung startet … (beim ersten Mal etwas länger)";setStatus(E.ocrMsg);
  let text="";
  try{text=await readText(input)}catch(e){if(S.edit===E){E.ocrBusy=false;setStatus("Texterkennung nicht verfügbar (offline?). Bitte Felder selbst ausfüllen.",true)}return}
  if(S.edit!==E)return;
  E.ocrBusy=false;
  readForm();E.doc.text=text.trim();
  const p=Letter.parseLetter(text,parseCtx());applyParsed(p,false);
  const got=[p.sender&&"Absender",p.subject&&"Betreff",p.date&&"Datum",p.deadline&&"Frist",p.ref&&"Aktenzeichen",p.amount!=null&&"Betrag"].filter(Boolean);
  drawEditor();
  setStatus(got.length?`Erkannt: ${got.join(", ")}. Bitte kurz prüfen.`:"Nichts sicher erkannt. Bitte Felder ausfüllen.");
  const dup=findDuplicate(E.doc);if(dup)setStatus(`Achtung: Ein ähnlicher Brief ist schon gespeichert (${dup.sender||""}, ${dfmt(dup.letterDate)}).`,true);
}
function findDuplicate(d){return live().find(x=>x.id!==d.id&&x.letterDate&&x.letterDate===d.letterDate&&fold(x.sender)===fold(d.sender)&&(fold(x.subject)===fold(d.subject)||(x.ref&&x.ref===d.ref)))}
async function editorClick(e){
  const b=e.target.closest("[data-act]");if(!b)return;const E=S.edit;
  switch(b.dataset.act){
    case "zoom":return openViewer(E.mode==="new"?(E.input?.images?.length?{images:E.input.images}:{blob:E.input?.file||E.pdf}):{doc:E.doc});
    case "cancel":if(E.mode==="new"&&!confirm("Brief verwerfen?"))return;closeSheet();return;
    case "tagdel":readForm();E.doc.tags.splice(+b.dataset.i,1);return drawEditor();
    case "tagadd":readForm();E.doc.tags.push(b.dataset.t);return drawEditor();
    case "st":readForm();E.doc.status=b.dataset.s;return drawEditor();
    case "resum":readForm();E.doc.summary=summaryFromFields(E.doc);return drawEditor();
    case "reparse":{readForm();const p=Letter.parseLetter(E.doc.text,parseCtx());applyParsed(p,true);drawEditor();setStatus("Felder aus dem Text neu gelesen.");return}
    case "save":{
      addTagFromInput();readForm();const d=E.doc;
      if(E.ocrBusy&&!confirm("Die Texterkennung läuft noch. Trotzdem speichern? Der Text fehlt dann für die Suche."))return;
      if(!d.sender&&!d.subject){setStatus("Bitte mindestens Absender oder Betreff angeben.",true);return}
      if(!d.category)d.category=catNames()[catNames().length-1];
      if(d.deadline&&!d.deadlineKind)d.deadlineKind="Frist";
      b.disabled=true;
      if(E.mode==="new"){
        d.fileId=await storeFile(E.pdf,fileName(d));
        if(E.thumb)d.thumbId=await storeFile(E.thumb,"vorschau.jpg");
      }
      d.updatedAt=new Date().toISOString();
      await dbPut("docs",d);
      const i=S.docs.findIndex(x=>x.id===d.id);if(i>=0)S.docs[i]=d;else S.docs.push(d);
      closeSheet();render();toast(E.mode==="new"?"Brief gespeichert":"Gespeichert");scheduleSync();
      if(E.mode==="new"&&S.settings.calOn&&d.deadline&&!S.settings.driveLinked)toast("Für die Kalender-Erinnerung zuerst mit Google verbinden");
      return;
    }
  }
}

async function deleteDocs(list){
  const now=new Date().toISOString(),ids=new Set(list.map(d=>d.id));
  for(const d of list){
    S.deleted[d.id]=now;
    if(d.driveId)S.trash.push({kind:"file",id:d.driveId});if(d.calId)S.trash.push({kind:"cal",id:d.calId});
    await dbDel("docs",d.id);
    for(const fid of [d.fileId,d.thumbId])if(fid)await dbDel("files",fid).catch(()=>{});
  }
  await dbPut("meta",{key:"deleted",items:S.deleted});
  await dbPut("meta",{key:"trash",items:S.trash});
  S.docs=S.docs.filter(x=>!ids.has(x.id));
}

/* ---- Teilen: einzelne PDFs oder ein zusammengefasstes PDF (wird auf dem Handy erzeugt) ---- */
const PDFLIB="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js";
async function mergePdfs(blobs){
  await loadLib(PDFLIB,()=>!!window.PDFLib);
  const out=await PDFLib.PDFDocument.create();
  for(const b of blobs){
    const pdf=(b.type||"").startsWith("image/")?await toPdf(b):b;
    const src=await PDFLib.PDFDocument.load(await pdf.arrayBuffer(),{ignoreEncryption:true});
    (await out.copyPages(src,src.getPageIndices())).forEach(p=>out.addPage(p));
  }
  return new Blob([await out.save()],{type:"application/pdf"});
}
async function shareFiles(files,title){
  if(navigator.canShare?.({files})){await navigator.share({files,title});return}
  for(const f of files){const u=URL.createObjectURL(f);const a=document.createElement("a");a.href=u;a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)}
}
function bulkShare(){
  const list=selDocs().sort((a,b)=>docDate(a).localeCompare(docDate(b))),n=list.length;if(!n)return;
  S.edit={mode:"bulk",urls:[]};let ready=null;
  sheet(`${nBriefe(n)} teilen`,`<div class="sec"><div class="optlist">
      <button type="button" class="btn" data-act="mode" data-m="single">Einzelne PDFs<small>Jeder Brief bleibt eine eigene Datei.</small></button>
      <button type="button" class="btn" data-act="mode" data-m="merge">Ein zusammengefasstes PDF<small>Alle Briefe hintereinander, nach Datum sortiert.</small></button>
    </div><div id="edStatus" class="status"></div>
    <div class="btnrow" id="shareGoRow" hidden><button type="button" class="btn primary" data-act="go">Jetzt teilen</button></div></div>`,
    `<button type="button" class="btn" data-act="close">Abbrechen</button>`);
  const go=async()=>{
    try{await shareFiles(ready.files,ready.title);closeSheet();endSel();if(ready.miss)toast(`${ready.miss} Datei${ready.miss===1?"":"en"} nicht verfügbar und ausgelassen`)}
    catch(err){if(err?.name==="AbortError")return;$("#shareGoRow").hidden=false;setStatus("Bereit. Tippe auf „Jetzt teilen“.")}
  };
  $("#scrim").addEventListener("click",async e=>{const b=e.target.closest("[data-act]");if(!b)return;
    if(b.dataset.act==="close")return closeSheet();
    if(b.dataset.act==="go"&&ready)return go();
    if(b.dataset.act!=="mode"||S.edit?.busy)return;
    S.edit.busy=true;$("#shareGoRow").hidden=true;ready=null;
    $("#scrim").querySelectorAll("[data-act=mode]").forEach(x=>x.disabled=true);
    try{
      const blobs=[],used=new Set(),files=[];let miss=0;
      for(let i=0;i<n;i++){
        setStatus(`Datei ${i+1} von ${n} wird geladen …`);
        const bl=await docBlob(list[i]).catch(()=>null);if(!bl){miss++;continue}
        blobs.push({d:list[i],bl});
      }
      if(!blobs.length){setStatus("Keine der Dateien ist verfügbar. Sie sind nicht auf diesem Handy und Google Drive ist nicht verbunden.",true);return}
      if(b.dataset.m==="merge"){
        setStatus("PDF wird zusammengefasst …");
        const m=await mergePdfs(blobs.map(x=>x.bl));
        files.push(new File([m],`Dokumente_${today()}_${blobs.length}_Briefe.pdf`,{type:"application/pdf"}));
      }else for(const {d,bl} of blobs){
        let name=d.name||fileName(d),k=2;while(used.has(name))name=name.replace(/(_\d+)?\.pdf$/i,`_${k++}.pdf`);used.add(name);
        files.push(new File([bl],name,{type:bl.type||"application/pdf"}));
      }
      ready={files,title:nBriefe(blobs.length),miss};
      setStatus(miss?`${miss} Datei${miss===1?"":"en"} nicht verfügbar und ausgelassen.`:"",!!miss);
      await go();
    }catch(err){setStatus(b.dataset.m==="merge"?"Zusammenfassen nicht möglich (offline?). Einzelne PDFs gehen weiterhin.":"Teilen nicht möglich.",true)}
    finally{if(S.edit)S.edit.busy=false;$("#scrim")?.querySelectorAll("[data-act=mode]").forEach(x=>x.disabled=false)}
  });
}

function collectSettings(){
  const s=S.settings;
  s.categories=s.categories.map((c,i)=>({name:($("#cn"+i)?.value??c.name).trim().replace(/[\\:*?"<>|#%]+/g," ")||c.name,

  const n=(id,def,min,max)=>{const v=+($("#"+id)?.value);return v>=min&&v<=max?Math.round(v):def};
  s.remindDays=n("remD",s.remindDays??3,1,27);s.soonDays=n("soonD",s.soonDays??14,1,90);
}
function blobToB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(blob)})}
function exportData(){

  S.settings.lastBackup=new Date().toISOString();await dbPut("meta",{key:"settings",...S.settings});

async function restoreBackup(file){
  try{const d=JSON.parse(await file.text());if(d.app!=="dokumente"||!Array.isArray(d.docs))throw new Error("Keine Sicherung dieser App.");
    if(!confirm(`${d.docs.length} Dokumente aus der Sicherung übernehmen? Neuere Angaben auf dem Handy bleiben erhalten.`))return;
    const map=new Map(S.docs.map(x=>[x.id,x]));
    for(const r of d.docs){const l=map.get(r.id);if(!l||(r.updatedAt||"")>(l.updatedAt||"")){const m={...r};if(l){m.fileId=l.fileId;m.thumbId=l.thumbId}map.set(r.id,m);await dbPut("docs",m)}}

const TESS="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
let tessWorker=null;
function loadScript(src){return new Promise((res,rej)=>{if(window.Tesseract)return res();const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("load"));document.head.appendChild(s)})}
async function ensureTess(){
  await loadScript(TESS);
  if(!tessWorker)tessWorker=await Tesseract.createWorker("deu",1,{logger:m=>{if(m.status==="recognizing text")setStatus(`Wird gelesen … ${Math.round(m.progress*100)} %`)}});
}
function loadLib(src,test){return new Promise((res,rej)=>{if(test())return res();const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("load"));document.head.appendChild(s)})}
async function prepareForOcr(file){
  try{
    const bmp=await createImageBitmap(file);const sc=Math.min(1,2600/Math.max(bmp.width,bmp.height));
    const w=Math.round(bmp.width*sc),h=Math.round(bmp.height*sc);
    const cv=document.createElement("canvas");cv.width=w;cv.height=h;const ctx=cv.getContext("2d",{willReadFrequently:true});
    ctx.drawImage(bmp,0,0,w,h);
    const bg=document.createElement("canvas");bg.width=w;bg.height=h;const bx=bg.getContext("2d",{willReadFrequently:true});
    bx.filter=`blur(${Math.round(Math.max(w,h)/80)}px)`;bx.drawImage(cv,0,0);
    const a=ctx.getImageData(0,0,w,h),b=bx.getImageData(0,0,w,h),d=a.data,e=b.data;
    if(e[0]===d[0]&&e[1]===d[1]&&e[w*4*Math.floor(h/2)]===d[w*4*Math.floor(h/2)]){} // Weichzeichnen evtl. nicht unterstützt
    for(let i=0;i<d.length;i+=4){
      const g=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2],bgv=Math.max(1,0.299*e[i]+0.587*e[i+1]+0.114*e[i+2]);
      const v=Math.min(255,g/bgv*255);d[i]=d[i+1]=d[i+2]=v;
    }
    ctx.putImageData(a,0,0);
    return await new Promise(r=>cv.toBlob(x=>r(x||file),"image/png"));
  }catch{return shrink(file,2000,0.9)}
}

// Blatt finden: hellste zusammenhängende Fläche (Otsu-Schwelle), Ecken über Extrempunkte
// Blatt finden: helle zusammenhängende Fläche. Mehrere Helligkeitsschwellen probieren
// (heller Tisch neben weißem Papier) und die Fläche nehmen, die das Viereck am besten ausfüllt.
function polyArea(p){let a=0;for(let k=0;k<p.length;k++){const [x1,y1]=p[k],[x2,y2]=p[(k+1)%p.length];a+=x1*y2-x2*y1}return Math.abs(a)/2}
// Konvexe Hülle (Monotone Chain)
function convexHull(pts){
  const P=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);if(P.length<3)return P;
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]),lo=[],up=[];
  for(const p of P){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p)}
  for(let i=P.length-1;i>=0;i--){const p=P[i];while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p)}
  lo.pop();up.pop();return lo.concat(up);
}
// Ecken sortieren: oben links, oben rechts, unten rechts, unten links
function orderQuad(q){
  const cx=q.reduce((s,p)=>s+p[0],0)/4,cy=q.reduce((s,p)=>s+p[1],0)/4;
  q=q.slice().sort((p,r)=>Math.atan2(p[1]-cy,p[0]-cx)-Math.atan2(r[1]-cy,r[0]-cx));
  let st=0;q.forEach((p,i)=>{if(p[0]+p[1]<q[st][0]+q[st][1])st=i});
  return q.slice(st).concat(q.slice(0,st)).map(p=>[p[0],p[1]]);
}
// Viereck aus dem Umriss: Hülle vereinfachen, Blattseiten = Hüllkanten, die das kleinste umschließende Viereck bilden,
// Ecken = Schnittpunkte benachbarter Seiten. So werden auch abgeschattete oder umgeknickte Ecken rekonstruiert.
function quadFromPoints(pts,w,h){
  let H=convexHull(pts);if(H.length<4)return null;
  const tri=(a,b,c)=>Math.abs((b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]))/2;
  const total=polyArea(H);
  const minTri=()=>{let bi=0,bv=1e18;for(let i=0;i<H.length;i++){const v=tri(H[(i-1+H.length)%H.length],H[i],H[(i+1)%H.length]);if(v<bv){bv=v;bi=i}}return [bi,bv]};
  for(;;){if(H.length<=4)break;const [bi,bv]=minTri();if(H.length>12||bv<total*0.002){H.splice(bi,1)}else break}
  // fast gerade Knicke entfernen (Seite in zwei Stücke geteilt)
  const dir=(a,b)=>Math.atan2(b[1]-a[1],b[0]-a[0]);
  const turn=i=>{const n=H.length,a=H[(i-1+n)%n],b=H[i],c=H[(i+1)%n];let d=Math.abs(dir(a,b)-dir(b,c));if(d>Math.PI)d=2*Math.PI-d;return d};
  for(let ch=true;ch&&H.length>4;){ch=false;for(let i=0;i<H.length&&H.length>4;i++)if(turn(i)<10*Math.PI/180){H.splice(i,1);ch=true;break}}
  if(H.length===4)return orderQuad(H);
  const n=H.length,len=i=>Math.hypot(H[(i+1)%n][0]-H[i][0],H[(i+1)%n][1]-H[i][1]);
  let per=0;for(let i=0;i<n;i++)per+=len(i);
  const cut=(i,j)=>{const [a,b]=[H[i],H[(i+1)%n]],[c,d]=[H[j],H[(j+1)%n]];
    const r=[b[0]-a[0],b[1]-a[1]],s=[d[0]-c[0],d[1]-c[1]],den=r[0]*s[1]-r[1]*s[0];if(Math.abs(den)<1e-9)return null;
    const sn=Math.abs(den)/(Math.hypot(...r)*Math.hypot(...s));if(sn<Math.sin(40*Math.PI/180))return null;
    const t=((c[0]-a[0])*s[1]-(c[1]-a[1])*s[0])/den;return [a[0]+t*r[0],a[1]+t*r[1]]};

  const grid=new Uint8Array(w*h);for(const [x,y] of pts)for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const X=x+dx,Y=y+dy;if(X>=0&&Y>=0&&X<w&&Y<h)grid[Y*w+X]=1}
  let sgn=0;for(let i=0;i<n;i++){const a=H[i],b=H[(i+1)%n];sgn+=a[0]*b[1]-b[0]*a[1]}
  // Kandidaten-Linien: Hüllkanten und Sehnen über bis zu 3 Hüllpunkte hinweg (überspringt Ausbuchtungen wie Finger).
  // Jede Linie muss lang genug und entlang ihrer Länge von echten Randpunkten gestützt sein.
  const seg=(i,j)=>{const A=H[i%n],B=H[j%n];return {i,j,A,B,len:Math.hypot(B[0]-A[0],B[1]-A[1])}};
  const supS=L=>{let k=0;for(let t=0;t<24;t++){const f=(t+.5)/24,X=Math.round(L.A[0]+(L.B[0]-L.A[0])*f),Y=Math.round(L.A[1]+(L.B[1]-L.A[1])*f);if(X>=0&&Y>=0&&X<w&&Y<h&&grid[Y*w+X])k++}return k/24};
  const lines=[];for(let i=0;i<n;i++)for(let sk=1;sk<=Math.min(4,n-3);sk++){const L=seg(i,i+sk);if(L.len>=per/4*0.25&&supS(L)>=(sk===1?0.7:0.8))lines.push(L)}
  const cutL=(L,M)=>{const r=[L.B[0]-L.A[0],L.B[1]-L.A[1]],s2=[M.B[0]-M.A[0],M.B[1]-M.A[1]],den=r[0]*s2[1]-r[1]*s2[0];if(Math.abs(den)<1e-9)return null;
    if(Math.abs(den)/(L.len*M.len)<Math.sin(40*Math.PI/180))return null;const t=((M.A[0]-L.A[0])*s2[1]-(M.A[1]-L.A[1])*s2[0])/den;return [L.A[0]+t*r[0],L.A[1]+t*r[1]]};
  const sg=Math.sign(sgn)||1;
  const insideX=(P,skip)=>H.every((v,vi)=>{if(skip.has(vi))return true;for(let k=0;k<4;k++){const a=P[k],b=P[(k+1)%4],cr=(b[0]-a[0])*(v[1]-a[1])-(b[1]-a[1])*(v[0]-a[0]);if(cr*sg<-2*Math.hypot(b[0]-a[0],b[1]-a[1]))return false}return true});
  // Linien in Umlaufreihenfolge, ohne Überlappung; kleinstes gültiges Viereck gewinnt
  const pick=lines=>{let q=null,qa=1e18;const m=lines.length;
  for(let a=0;a<m;a++){const L0=lines[a];for(let b=0;b<m;b++){const L1=lines[b];if(L1.i<L0.j||L1.i>=L0.i+n)continue;
    for(let c=0;c<m;c++){const L2=lines[c];if(L2.i<L1.j||L2.i>=L0.i+n)continue;
      for(let d=0;d<m;d++){const L3=lines[d];if(L3.i<L2.j||L3.j>L0.i+n)continue;
        const S=[L0,L1,L2,L3],P=[];let ok=true;
        for(let k=0;k<4&&ok;k++){const p=cutL(S[k],S[(k+1)%4]);if(!p||p[0]<-0.05*w||p[1]<-0.05*h||p[0]>1.05*w||p[1]>1.05*h)ok=false;else P.push(p)}
        if(!ok)continue;const ar=polyArea(P);if(ar>=qa)continue;
        const skip=new Set();for(const L of S)for(let v=L.i+1;v<L.j;v++)skip.add(v%n);
        if(insideX(P,skip)){qa=ar;q=P}}}}}
    return q};
  // zuerst nur echte Hüllkanten, Sehnen nur wenn nötig
  let q=pick(lines.filter(L=>L.j-L.i===1))||pick(lines);
  if(!q)return fallbackQuad(H);
  q=q.map(p=>[Math.max(0,Math.min(w-1,p[0])),Math.max(0,Math.min(h-1,p[1]))]);
  return orderQuad(q);
}
// Rückfall: größtes Viereck aus den Hüllpunkten
function fallbackQuad(H){
  const n=H.length;let best=null,ba=-1;
  for(let a=0;a<n;a++)for(let b=a+1;b<n;b++)for(let c=b+1;c<n;c++)for(let d=c+1;d<n;d++){const ar=polyArea([H[a],H[b],H[c],H[d]]);if(ar>ba){ba=ar;best=[H[a],H[b],H[c],H[d]]}}

function detectQuad(src){
  const W=360,sc=W/Math.max(src.width,src.height),w=Math.max(1,Math.round(src.width*sc)),h=Math.max(1,Math.round(src.height*sc));
  const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d",{willReadFrequently:true});x.filter="blur(2px)";x.drawImage(src,0,0,w,h);
  const d=x.getImageData(0,0,w,h).data,g=new Uint8Array(w*h);
  for(let i=0;i<w*h;i++)g[i]=(d[i*4]*0.299+d[i*4+1]*0.587+d[i*4+2]*0.114)|0;
  const otsu=(lo)=>{const hist=new Array(256).fill(0);let n=0;for(let i=0;i<w*h;i++)if(g[i]>lo){hist[g[i]]++;n++}
    let sum=0;for(let i=0;i<256;i++)sum+=i*hist[i];let sB=0,wB=0,best=0,th=lo+1;
    for(let t=lo+1;t<256;t++){wB+=hist[t];if(!wB)continue;const wF=n-wB;if(!wF)break;sB+=t*hist[t];const mB=sB/wB,mF=(sum-sB)/wF,v=wB*wF*(mB-mF)**2;if(v>best){best=v;th=t}}
    return th};
  const comp=th=>{const lab=new Int32Array(w*h);let bestLab=0,bestSize=0,cur=0;const st=[];
    for(let i=0;i<w*h;i++){if(g[i]<=th||lab[i])continue;cur++;let size=0;st.push(i);lab[i]=cur;
      while(st.length){const p=st.pop();size++;const px=p%w,py=(p/w)|0;
        for(const q of [px>0?p-1:-1,px<w-1?p+1:-1,py>0?p-w:-1,py<h-1?p+w:-1])if(q>=0&&!lab[q]&&g[q]>th){lab[q]=cur;st.push(q)}}
      if(size>bestSize){bestSize=size;bestLab=cur}}
    if(!bestSize)return null;
    // Umriss: je Zeile linkester/rechtester Punkt der Fläche -> konvexe Hülle -> größtes einbeschriebenes Viereck
    const pts=[];for(let y=0;y<h;y++){let l=-1,r=-1;for(let x=0;x<w;x++)if(lab[y*w+x]===bestLab){if(l<0)l=x;r=x}if(l>=0){pts.push([l,y]);if(r!==l)pts.push([r,y])}}
    for(let x=0;x<w;x++){let t=-1,b=-1;for(let y=0;y<h;y++)if(lab[y*w+x]===bestLab){if(t<0)t=y;b=y}if(t>=0){pts.push([x,t]);if(b!==t)pts.push([x,b])}}
    const q=quadFromPoints(pts,w,h);if(!q)return null;
    const area=polyArea(q);
    return {size:bestSize,quad:q,fill:area?bestSize/area:0}};
  const t1=otsu(-1),cands=[];
  for(const th of [t1,otsu(t1),Math.round((t1+otsu(t1))/2)]){const r=comp(th);if(r&&r.size>=w*h*0.12)cands.push(r)}
  const full=[[0.03,0.03],[0.97,0.03],[0.97,0.97],[0.03,0.97]].map(([a,b])=>[a*src.width,b*src.height]);
  if(!cands.length)return full;
  // Lieber etwas Rand zu viel als abgeschnittener Inhalt: größte Fläche nehmen, außer sie ist praktisch das ganze Foto
  // (Blatt auf hellem Tisch) oder kein sauberes Viereck – dann die strengere Schwelle
  cands.forEach(c=>c.qa=c.size/c.fill);cands.sort((a,b)=>b.size-a.size);
  const pick=cands.find(c=>c.qa<w*h*0.9&&c.fill>=0.8)||cands.sort((a,b)=>b.fill-a.fill)[0];
  return pick.quad.map(([px,py])=>[px/sc,py/sc]);
}
function drawScanEdit(){

    <div class="btnrow"><button type="button" class="btn" data-act="scanfull">Ganzes Foto verwenden</button><button type="button" class="btn" data-act="scanauto">Ränder neu suchen</button></div>

  const ctx=cv.getContext("2d");
  const paint=()=>{ctx.drawImage(cur.src,0,0,cv.width,cv.height);const q=cur.quad.map(([x,y])=>[x*k,y*k]);
    ctx.fillStyle="rgba(22,58,107,.18)";ctx.strokeStyle="#7fb2e8";ctx.lineWidth=3;ctx.beginPath();q.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fill();ctx.stroke();
    for(const [x,y] of q){ctx.beginPath();ctx.arc(x,y,13,0,7);ctx.fillStyle="rgba(255,255,255,.9)";ctx.fill();ctx.lineWidth=3;ctx.stroke()}};

  cv.addEventListener("pointerdown",e=>{const [x,y]=pos(e);let bd=40;cur.quad.forEach(([qx,qy],i)=>{const dd=Math.hypot(qx*k-x,qy*k-y);if(dd<bd){bd=dd;drag=i}});if(drag>=0){cv.setPointerCapture(e.pointerId);e.preventDefault()}});
  cv.addEventListener("pointermove",e=>{if(drag<0)return;const [x,y]=pos(e);cur.quad[drag]=[Math.max(0,Math.min(cur.w,x/k)),Math.max(0,Math.min(cur.h,y/k))];paint()});

// Perspektive entzerren (Quadrat -> Viereck, Heckbert), bilinear abtasten
function warpQuad(src,quad){
  const [[x0,y0],[x1,y1],[x2,y2],[x3,y3]]=quad;
  let W=Math.max(Math.hypot(x1-x0,y1-y0),Math.hypot(x2-x3,y2-y3)),H=Math.max(Math.hypot(x3-x0,y3-y0),Math.hypot(x2-x1,y2-y1));
  const sc=Math.min(1,3200/Math.max(W,H));W=Math.max(10,Math.round(W*sc));H=Math.max(10,Math.round(H*sc));
  const sx=x0-x1+x2-x3,sy=y0-y1+y2-y3;let a,b,c,d,e,f,g=0,h=0;
  if(Math.abs(sx)<1e-6&&Math.abs(sy)<1e-6){a=x1-x0;b=x3-x0;c=x0;d=y1-y0;e=y3-y0;f=y0}
  else{const dx1=x1-x2,dx2=x3-x2,dy1=y1-y2,dy2=y3-y2,den=dx1*dy2-dx2*dy1;g=(sx*dy2-dx2*sy)/den;h=(dx1*sy-sx*dy1)/den;
    a=x1-x0+g*x1;b=x3-x0+h*x3;c=x0;d=y1-y0+g*y1;e=y3-y0+h*y3;f=y0}
  const sw=src.width,shh=src.height,sd=src.getContext("2d",{willReadFrequently:true}).getImageData(0,0,sw,shh).data;
  const out=document.createElement("canvas");out.width=W;out.height=H;const oc=out.getContext("2d");const od=oc.createImageData(W,H),o=od.data;
  for(let j=0;j<H;j++){const v=j/(H-1);for(let i=0;i<W;i++){const u=i/(W-1),den=g*u+h*v+1;
    let X=(a*u+b*v+c)/den,Y=(d*u+e*v+f)/den;if(X<0)X=0;if(Y<0)Y=0;if(X>sw-1.001)X=sw-1.001;if(Y>shh-1.001)Y=shh-1.001;

    for(let ch=0;ch<3;ch++){o[t+ch]=(sd[p+ch]*(1-fx)+sd[p+4+ch]*fx)*(1-fy)+(sd[q+ch]*(1-fx)+sd[q+4+ch]*fx)*fy}o[t+3]=255}}

}

// Farbe aufgehellt: Weiß- und Schwarzpunkt aus der Helligkeitsverteilung (Perzentile), Farben und Grauflächen bleiben erhalten
function brightenColor(cv){
  const w=cv.width,h=cv.height,ctx=cv.getContext("2d",{willReadFrequently:true}),a=ctx.getImageData(0,0,w,h),d=a.data;
  const hist=new Uint32Array(256);let n=0;
  for(let i=0;i<d.length;i+=16){hist[(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2])|0]++;n++}

  const lo=Math.min(pct(0.01),60),hi=Math.max(pct(0.90),lo+60),k=255/(hi-lo),lut=new Uint8ClampedArray(256);

  for(let i=0;i<d.length;i+=4){d[i]=lut[d[i]];d[i+1]=lut[d[i+1]];d[i+2]=lut[d[i+2]]}
  ctx.putImageData(a,0,0);return cv;
}
// Scan-Look: Graustufen, Licht ausgleichen, Papier weiß, Schrift kräftig
function enhanceScan(cv){
  const w=cv.width,h=cv.height,ctx=cv.getContext("2d",{willReadFrequently:true});
  const bg=document.createElement("canvas");bg.width=w;bg.height=h;const bx=bg.getContext("2d",{willReadFrequently:true});

async function docText(file){

    await loadLib(PDFJS,()=>!!window.pdfjsLib);
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
    const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
    let text="";const pages=Math.min(pdf.numPages,12);
    for(let p=1;p<=pages;p++){
      const page=await pdf.getPage(p);const tc=await page.getTextContent();
      // Textstücke zu Zeilen zusammensetzen (gleiche Höhe)
      const rows=new Map();for(const it of tc.items){const y=Math.round(it.transform[5]);const r=rows.get(y)||[];r.push([it.transform[4],it.str]);rows.set(y,r)}
      let pt=[...rows.entries()].sort((a,b)=>b[0]-a[0]).map(([,r])=>r.sort((a,b)=>a[0]-b[0]).map(x=>x[1]).join(" ")).join("\n");

function jpegsToPdf(pages){
  const enc=new TextEncoder(),parts=[],off=[];let pos=0;
  const push=x=>{const b=typeof x==="string"?enc.encode(x):x;parts.push(b);pos+=b.length};

  obj(2,`<< /Type /Pages /Kids [${pages.map((_,i)=>`${3+i*3} 0 R`).join(" ")}] /Count ${n} >>`);
  pages.forEach((p,i)=>{
    const po=3+i*3,io=po+1,co=po+2;
    const s=Math.min(pw/p.w,ph/p.h),dw=+(p.w*s).toFixed(2),dh=+(p.h*s).toFixed(2),x=+((pw-dw)/2).toFixed(2),y=+((ph-dh)/2).toFixed(2);
    const content=`q ${dw} 0 0 ${dh} ${x} ${y} cm /Im0 Do Q`;
    obj(po,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 ${io} 0 R >> >> /Contents ${co} 0 R >>`);
    off[io]=pos;push(`${io} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /${p.gray?"DeviceGray":"DeviceRGB"} /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpg.length} >>\nstream\n`);push(p.jpg);push("\nendstream\nendobj\n");
    obj(co,`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
  });

  push(t+`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts,{type:"application/pdf"});
}

function calWanted(d){return S.settings.calOn&&d.deadline&&d.status!=="erledigt"}

    start:{date:d.deadline},end:{date:end},transparency:"transparent",

  try{
    for(const d of map.values()){

        const k=calKey(d);if(d.calId&&d.calKey===k)continue;
        if(d.calId){

          catch(e){if(e.code!=="gone")throw e;d.calId=null}
        }

        d.calKey=k;d.updatedAt=new Date().toISOString();

    }
    await calSync(map);
    // Gelöschte: Dateien in den Papierkorb, Termine entfernen
    for(const t of [...S.trash]){
      try{if(t.kind==="cal")await gfetch(`${CAL}/${t.id}`,{method:"DELETE"});else await gfetch(`${API}/${t.id}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({trashed:true})})}
      catch(e){if(e.code==="auth")throw e;if(e.code!=="gone"&&e.code!=="forbidden")continue}
      S.trash=S.trash.filter(x=>x!==t);
    }
    await dbPut("meta",{key:"trash",items:S.trash});
    if(remote?.settings&&(remote.settingsUpdatedAt||"")>(S.settings.updatedAt||"")){
      const keep=Object.fromEntries(LOCAL_KEYS.map(k=>[k,S.settings[k]]));
      S.settings={...DEFAULT_SETTINGS,...remote.settings,updatedAt:remote.settingsUpdatedAt,...keep};
    }
    const ids=new Set(map.keys());
    for(const old of S.docs)if(!ids.has(old.id))await dbDel("docs",old.id);
    for(const d of map.values())await dbPut("docs",d);
    S.docs=[...map.values()];
    await dbPut("meta",{key:"deleted",items:S.deleted});
    const data=exportData();
    const blob=new Blob([JSON.stringify(data)],{type:"application/json"});
    const up=await uploadMultipart(S.settings.driveDataId?{}:{name:DATA_NAME,parents:[S.settings.driveAppId]},blob,S.settings.driveDataId);
    if(!S.settings.driveDataId)S.settings.driveDataId=up.id;
    await dailySnapshot(data);
    await dbPut("meta",{key:"settings",...S.settings});
    G.last=new Date();glog("Abgleich erfolgreich ("+S.docs.length+" Dokumente)");
  }catch(e){G.err=e.code==="auth"?"auth":"fail";G.dirty=true;glog("Abgleich fehlgeschlagen: "+(e?.message||e))}
  finally{G.busy=false;updateChip();render()}
  if(G.dirty&&!G.err)scheduleSync();
}
async function dailySnapshot(data){
  const day=today();if(S.settings.lastSnapshot===day)return;
  try{
    if(!S.settings.driveSnapId)S.settings.driveSnapId=await findOrCreateFolder("Sicherungen",S.settings.driveAppId);
    const name=`Sicherung_${day}.json`;
    if(!await findFile(name,S.settings.driveSnapId)){
      await uploadMultipart({name,parents:[S.settings.driveSnapId]},new Blob([JSON.stringify(data)],{type:"application/json"}));glog("Tagessicherung erstellt: "+name)}
    S.settings.lastSnapshot=day;
  }catch(e){if(e.code==="auth")throw e;S.settings.driveSnapId=null;glog("Tagessicherung fehlgeschlagen")}
}
function driveStatus(){
  if(!S.settings.driveLinked)return {text:"Nicht verbunden.",pending:false};
  if(G.busy)return {text:"Gleicht gerade ab …",pending:false};
  const pending=G.dirty||!!G.err;
  if(G.err==="auth"||(pending&&!tokenValid()))return {text:"Änderungen sind noch nicht in Drive. Tippe auf „Jetzt abgleichen“.",pending:true};
  if(G.err)return {text:"Der letzte Abgleich ist fehlgeschlagen. Tippe auf „Jetzt abgleichen“.",pending:true};
  if(pending)return {text:"Änderungen werden gleich abgeglichen.",pending:true};
  if(G.last)return {text:"Alles in Drive gespeichert, zuletzt um "+G.last.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})+" Uhr.",pending:false};
  return {text:"Verbunden.",pending:false};
}
function updateChip(){
  try{if(G.dirty)localStorage.setItem("gdirty","1");else localStorage.removeItem("gdirty")}catch{}
  const st=driveStatus();$("#settingsDot").hidden=!st.pending;
  const el=$("#driveStatus");if(el)el.textContent=st.text;
}
try{if(localStorage.getItem("gdirty")==="1")G.dirty=true}catch{}
async function driveBlob(driveId){if(!tokenValid()||!driveId)return null;try{return await (await gfetch(`${API}/${driveId}?alt=media`)).blob()}catch{return null}}

/* ================= Dateien von außen: Teilen-Menü und „Öffnen mit“ ================= */
async function takeShared(){
  history.replaceState(null,"",location.pathname);
  try{const c=await caches.open("share-inbox");const key=new URL("shared-file",location.origin+location.pathname).href;
    const r=await c.match(key);if(!r)return;const b=await r.blob();await c.delete(key);
    takeIncoming(new File([b],decodeURIComponent(r.headers.get("x-name")||"Dokument"),{type:b.type||r.headers.get("content-type")||""}))}catch{toast("Die geteilte Datei konnte nicht gelesen werden.")}
}
async function takeIncoming(f){while(!S.loaded)await new Promise(r=>setTimeout(r,100));if(S.edit)closeSheet();
  if(isImg(f)){const pr=scanDocument("Brief erfassen");scanLoad(f);const r=await pr;if(r)openNew(r);return}
  openNew({file:f})}
if("launchQueue" in window)launchQueue.setConsumer(async p=>{if(p.files?.length){try{takeIncoming(await p.files[0].getFile())}catch{}}});

/* ================= Import vorhandener Dokumente (einmalig, Liste von Claude) ================= */
function importStatus(t){const b=$("#importBar");if(!b)return;b.hidden=!t;b.textContent=t||""}
function b64uToBlob(s,type){const b=atob(String(s).replace(/-/g,"+").replace(/_/g,"/"));const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new Blob([a],{type})}
async function pdfText(blob){
  try{await loadLib(PDFJS,()=>!!window.pdfjsLib);
    pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
    const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise;let t="";
    for(let i=1;i<=Math.min(pdf.numPages,8);i++){const tc=await (await pdf.getPage(i)).getTextContent();t+=tc.items.map(x=>x.str).join(" ")+"\n"}
    return {text:t.replace(/[ \t]+/g," ").trim(),pages:pdf.numPages};
  }catch{return {text:"",pages:0}}
}
function gmailPdfParts(thread,only){
  const out=[],seen=new Set();
  const walk=(p,msgId)=>{if(!p)return;
    const fn=p.filename||"";
    if(p.body?.attachmentId&&(/\.pdf$/i.test(fn)||p.mimeType==="application/pdf")&&(!only||only.includes(fn))){
      const k=fn+"|"+(p.body.size||0);if(!seen.has(k)){seen.add(k);out.push({msgId,attId:p.body.attachmentId,filename:fn||"Anhang.pdf"})}}
    for(const c of p.parts||[])walk(c,msgId)};
  for(const m of thread.messages||[])walk(m.payload,m.id);
  return out;
}
async function importOne(e){
  const doc={...blankDoc(),id:e.id,letterDate:e.letterDate||"",sender:e.sender||"",subject:e.subject||"",category:e.category||catNames().at(-1),
    tags:e.tags||[],summary:e.summary||"",ref:e.ref||"",refLabel:e.ref?"Nummer":"",amount:e.amount??null,status:e.status||"erledigt",text:e.text||"",imported:e.src.type};
  const target=await wantedFolder(doc),name=fileName(doc);let blob=null;
  if(e.src.type==="drive"){
    const c=await (await gfetch(`${API}/${e.src.fileId}/copy?fields=id,webViewLink,size`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,parents:[target]})})).json();
    doc.driveId=c.id;doc.url=c.webViewLink||`https://drive.google.com/file/d/${c.id}/view`;doc.folder=target;doc.name=name;
    if(+c.size&&+c.size<8e6)blob=await (await gfetch(`${API}/${c.id}?alt=media`)).blob();
  }else{
    const th=await (await gfetch(`${GMAIL}/threads/${e.src.threadId}?format=full`)).json();
    const parts=gmailPdfParts(th,e.src.files);
    if(!parts.length){doc.url=`https://mail.google.com/mail/u/0/#all/${e.src.threadId}`;doc.note="Kein PDF-Anhang – Link zur E-Mail."}
    for(let i=0;i<parts.length;i++){
      const p=parts[i],a=await (await gfetch(`${GMAIL}/messages/${p.msgId}/attachments/${p.attId}`)).json();
      const b=b64uToBlob(a.data,"application/pdf"),nm=i?name.replace(/\.pdf$/,`_Anlage-${i}.pdf`):name;
      const up=await uploadMultipart({name:nm,parents:[target],description:[doc.sender,doc.subject].join(" · ")},b);
      const url=up.webViewLink||`https://drive.google.com/file/d/${up.id}/view`;
      if(!i){doc.driveId=up.id;doc.url=url;doc.folder=target;doc.name=name;blob=b}
      else (doc.attachments=doc.attachments||[]).push({name:p.filename,driveId:up.id,url});
    }
  }
  if(blob){
    const r=await pdfText(blob);doc.pages=r.pages;if(!doc.text)doc.text=r.text.slice(0,12000);
    const t=await pdfThumb(blob);if(t)doc.thumbId=await storeFile(t,"vorschau.jpg");
  }
  doc.createdAt=doc.updatedAt=new Date().toISOString();
  await dbPut("docs",doc);S.docs.push(doc);
}
async function runImport(){
  if(G.importing||!tokenValid())return;G.importing=true;let fileId=null;
  try{
    importStatus("Import: Importliste wird gesucht …");
    const r=await (await gfetch(`${API}?q=${q("name='dokumente-import.json' and trashed=false")}&fields=files(id)`)).json();
    fileId=r.files?.[0]?.id;
    if(!fileId){toast("Keine Importliste in Drive gefunden");glog("Import: keine Importliste");S.settings.importMode=false;await dbPut("meta",{key:"settings",...S.settings});return}
    const data=await (await gfetch(`${API}/${fileId}?alt=media`)).json();
    let catAdded=false;for(const c of data.categories||[])if(!S.settings.categories.some(x=>x.name===c.name)){S.settings.categories.push(c);catAdded=true}
    if(catAdded)S.settings.updatedAt=new Date().toISOString();
    await ensureFolders();
    const todo=(data.entries||[]).filter(e=>!S.docs.some(d=>d.id===e.id)&&!S.deleted[e.id]);const fail=[];
    glog(`Import gestartet: ${todo.length} Dokumente`);
    for(let i=0;i<todo.length;i++){
      const e=todo[i];importStatus(`Import ${i+1} von ${todo.length}: ${e.sender||""} – ${e.subject||""}`);
      try{await importOne(e)}catch(err){if(err.code==="auth")throw err;fail.push(e.subject||e.id);glog("Import fehlgeschlagen: "+(e.subject||e.id))}
      if(i%5===4)render();
    }
    if(!fail.length)await gfetch(`${API}/${fileId}`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:`dokumente-import-erledigt-${today()}.json`})});
    S.settings.importMode=false;S.settings.lastImport={date:today(),ok:todo.length-fail.length,fail};
    await dbPut("meta",{key:"settings",...S.settings});
    glog(`Import fertig: ${todo.length-fail.length} übernommen, ${fail.length} fehlgeschlagen`);
    toast(fail.length?`${todo.length-fail.length} Dokumente übernommen, ${fail.length} fehlgeschlagen`:`${todo.length} Dokumente übernommen`);
  }catch(err){glog("Import unterbrochen: "+(err?.message||err));toast(err.code==="auth"?"Import unterbrochen: Anmeldung abgelaufen. In den Einstellungen „Import fortsetzen“ tippen.":"Import unterbrochen. In den Einstellungen „Import fortsetzen“ tippen.")}
  finally{G.importing=false;importStatus("");render();scheduleSync()}
}

/* ================= Start ================= */
(async()=>{
  render();
  try{
    const st=await dbGet("meta","settings");if(st){const {key,...rest}=st;S.settings={...DEFAULT_SETTINGS,...rest}}
    S.docs=await dbAll("docs");
    const del=await dbGet("meta","deleted");S.deleted=del?.items||{};
    const tq=await dbGet("meta","trash");S.trash=tq?.items||[];
  }catch(err){$("#list").innerHTML=`<div class="empty">Speicher nicht verfügbar. Bitte die App nicht im privaten Modus öffnen.</div>`;return}
  S.loaded=true;render();updateChip();
  if(new URLSearchParams(location.search).has("share"))takeShared();
  if(AUTH?.token&&!S.settings.driveLinked){S.settings.driveLinked=true;await dbPut("meta",{key:"settings",...S.settings});updateChip()}
  if(AUTH?.token&&S.settings.calOn&&AUTH.scope&&!AUTH.scope.includes("calendar")){glog("Kalender-Zugriff wurde nicht erlaubt");toast("Kalender-Zugriff wurde nicht erlaubt")}
  if(AUTH?.error){
    if(AUTH.silent&&/interaction_required|login_required|consent_required/.test(AUTH.error))return connectDrive(false);
    toast(AUTH.error==="access_denied"?"Anmeldung abgebrochen":"Anmeldung bei Google fehlgeschlagen ("+AUTH.error+")");
  }
  if(AUTH?.token)toast(S.settings.calOn?"Mit Google Drive und Kalender verbunden":"Mit Google Drive verbunden");
  if(S.settings.driveLinked&&tokenValid())syncNow().then(()=>{if(S.settings.importMode&&fullScope())runImport()});
  if(S.settings.importMode&&AUTH?.token&&!fullScope()){toast("Für den Import bitte Drive- und Gmail-Zugriff erlauben");glog("Import: Zugriff nicht vollständig erlaubt")}
  document.addEventListener("visibilitychange",async()=>{
    if(document.visibilityState!=="visible")return;
    try{const t=JSON.parse(localStorage.getItem("gtok")||"null");if(t&&t.exp>Date.now()&&t.token!==G.token){G.token=t.token;G.exp=t.exp}}catch{}
    updateChip();render();
    if(S.settings.driveLinked&&tokenValid()&&(G.dirty||!G.last||Date.now()-G.last>60000))syncNow();
  });
  try{await navigator.storage?.persist?.()}catch{}
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
