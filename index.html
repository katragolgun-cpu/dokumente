<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dokumente</title>
<meta name="theme-color" content="#24524a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Layout: mobile-first Ablage – Suche oben, Fristen-Leiste, Filter-Chips, Karten je Brief; Bottom-Sheet für Erfassen und Ansicht */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --sunken:#e7e9e4; --line:#d6dad2;
  --ink:#1b2420; --muted:#5d6a63;
  --accent:#24524a; --accent-ink:#ffffff;
  --ok:#1f7a45; --ok-soft:#dcefe3;
  --warn:#9a5b00; --warn-soft:#f7ead2;
  --bad:#b0322b; --bad-soft:#f6dedc;
  --wait:#3e5a9a; --wait-soft:#dfe6f5;
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:ui-monospace,"Roboto Mono","SFMono-Regular",Consolas,monospace;
  --r:16px; --shadow:0 1px 2px rgba(20,36,30,.06),0 4px 14px rgba(20,36,30,.06); color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#101614; --surface:#18211e; --sunken:#202b27; --line:#2d3a35;
  --ink:#e5ece8; --muted:#93a39b; --accent:#8cc9b9; --accent-ink:#0d2620;
  --ok:#5cc489; --ok-soft:#173326; --warn:#e2a54a; --warn-soft:#3a2c14;
  --bad:#f0827a; --bad-soft:#3d1d1b; --wait:#8fa9e6; --wait-soft:#1e2a45; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
header.top h1{font-size:26px;margin:0;font-weight:700;letter-spacing:-.02em}
header.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.iconbtn{position:relative;border:0;background:var(--surface);box-shadow:var(--shadow);color:var(--ink);border-radius:12px;padding:9px 10px;font:inherit;display:flex;align-items:center}
.iconbtn svg{width:20px;height:20px}
.dot{position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:var(--warn);border:2px solid var(--bg)}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:12px 40px 12px 40px;border:0;border-radius:14px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:4px 8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--surface);box-shadow:var(--shadow);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:13.5px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip .c{font-family:var(--f-num);font-size:12px;opacity:.7;margin-left:4px}
.due-box{background:linear-gradient(135deg,#24524a,#173a34);color:#fff;border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
@media (prefers-color-scheme: dark){.due-box{background:linear-gradient(135deg,#1d4740,#10302a)}}
.due-box h2{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.08em;opacity:.85}
.due-item{display:flex;justify-content:space-between;gap:10px;align-items:center;border:0;background:rgba(255,255,255,.1);color:inherit;font:inherit;text-align:left;border-radius:12px;padding:9px 12px;width:100%}
.due-item .t{font-weight:600;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.due-item .s{font-size:12.5px;opacity:.85}
.due-item .d{font-family:var(--f-num);font-size:13px;white-space:nowrap;font-weight:600}
.due-item.over .d{color:#ffc7c2}
.list{display:flex;flex-direction:column;gap:10px}
.grp{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--sunken);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;font-size:14.5px;font-weight:600;text-align:left;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;margin-top:4px}
.grp .chev{flex:none;width:16px;height:16px;transition:transform .15s;color:var(--muted)}
.grp[aria-expanded="true"] .chev{transform:rotate(90deg)}
.grp .gn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp .c{font-family:var(--f-num);font-size:12.5px;color:var(--muted);font-weight:500}
.grp.allsel{box-shadow:0 0 0 2px var(--accent)}
.chips .lbl{flex:none;align-self:center;font-size:12.5px;color:var(--muted);padding-left:2px}
/* Filter: Knopf neben der Suche, Panel von unten */
.srow{display:flex;gap:8px;align-items:stretch}
.srow .search{flex:1;min-width:0}
.srow .iconbtn{border-radius:14px;padding:0 13px}
.srow .iconbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.fbadge{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:700 11.5px/19px var(--f-num);text-align:center;border:2px solid var(--bg)}
.chips.act{margin-top:-4px;flex-wrap:wrap;overflow:visible}
.chip.on{background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:2px;padding-right:8px}
.chip.on .x{font-size:17px;line-height:1;opacity:.75;padding:0 2px 0 6px}
.chip.plain{padding-right:14px;background:var(--surface);color:var(--ink)}
.chips.fwrap{flex-wrap:wrap;overflow:visible}
.fsec h3{margin:0 0 2px}
.year{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-top:6px}
.card{background:var(--surface);border:0;box-shadow:var(--shadow);border-radius:var(--r);padding:13px 15px;display:flex;gap:12px;text-align:left;font:inherit;color:inherit;width:100%;align-items:flex-start}
.card:active{transform:scale(.99)}
.card .th{flex:none;width:46px;height:60px;border-radius:6px;background:var(--sunken);object-fit:cover;object-position:top;border:1px solid var(--line)}
.card .th.ph{display:grid;place-items:center;color:var(--muted)}
.card .th.ph svg{width:22px;height:22px}
.card .body{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.card .r1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .snd{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.card .dt{font-family:var(--f-num);font-size:12.5px;color:var(--muted);white-space:nowrap}
.card .sbj{font-size:14px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:3px}
.card .hit{font-size:12.5px;color:var(--muted);background:var(--sunken);border-radius:8px;padding:5px 8px;margin-top:3px}
.card .hit mark{background:var(--warn-soft);color:var(--ink);border-radius:3px;padding:0 1px}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunken);color:var(--ink)}
.stamp{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:6px;border:1.5px solid currentColor;white-space:nowrap}
.s-neu{color:var(--wait);background:var(--wait-soft)} .s-todo{color:var(--warn);background:var(--warn-soft)} .s-ok{color:var(--ok);background:var(--ok-soft)} .s-bad{color:var(--bad);background:var(--bad-soft)}
.empty{background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r);padding:24px 16px;text-align:center;color:var(--muted)}
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(22px + env(safe-area-inset-bottom,0px));height:58px;display:flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:29px;padding:0 22px 0 18px;box-shadow:0 6px 20px rgba(0,0,0,.22);z-index:7;font:inherit;font-weight:700;font-size:15px}
.fab svg{width:24px;height:24px}
.fab .fabn{min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--accent-ink);color:var(--accent);font:700 13px/24px var(--f-num);text-align:center}
.newcat{display:flex;gap:8px;align-items:flex-end}
.newcat .f{flex:1}
/* Mehrfachauswahl */
.card{position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.card.sel{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.card .ck{position:absolute;top:7px;left:7px;width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);background:var(--surface);display:grid;place-items:center;font-size:13px;font-weight:700;color:transparent}
.card.sel .ck{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);box-shadow:0 -4px 18px rgba(0,0,0,.15);border-radius:18px 18px 0 0;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.selbar .in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.selhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.selacts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.selacts .btn{padding:10px 4px;font-weight:600;font-size:13.5px}
body.selmode .toast{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
.optlist{display:flex;flex-direction:column;gap:8px}
.optlist .btn{text-align:left;padding:12px 14px;font-size:15px}
.optlist .btn small{display:block;color:var(--muted);font-size:12.5px;font-weight:400;margin-top:2px}
.scrim{position:fixed;inset:0;background:rgba(10,18,15,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:94%;overflow-y:auto;border-radius:18px 18px 0 0;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-head{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0 10px;z-index:2;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sheet-head h2{margin:0;font-size:18px;min-width:0;overflow-wrap:break-word}
.sec{background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r);padding:14px;margin-top:12px;display:flex;flex-direction:column;gap:10px}
.sec h3{margin:0;font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.hero .snd{font-size:13px;color:var(--muted);font-weight:600}
.hero .sbj{font-size:19px;font-weight:700;line-height:1.3}
.summary{white-space:pre-line;font-size:14.5px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px}
.kv .k{color:var(--muted);font-size:13px}
.kv .v{overflow-wrap:anywhere}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 6px;font:inherit;font-size:14px;font-weight:600}
.seg button[aria-pressed="true"].neu{background:var(--wait-soft);color:var(--wait);border-color:var(--wait)}
.seg button[aria-pressed="true"].todo{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.seg button[aria-pressed="true"].erledigt{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
label.f.full{grid-column:1/-1}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-width:0}
textarea{resize:vertical;font-size:15px}
textarea.mono{font-family:var(--f-num);font-size:12.5px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 13px;font:inherit;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.link{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 0}
.btn[disabled]{opacity:.55}
.status{font-size:13.5px;color:var(--muted)} .status.err{color:var(--bad)}
.hint{background:var(--warn-soft);color:var(--warn);border-radius:9px;padding:8px 10px;font-size:13.5px}
.tagedit{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tagedit .tag{display:inline-flex;align-items:center;gap:4px;padding:4px 6px 4px 10px;font-size:13px}
.tagedit .tag button{border:0;background:none;color:var(--muted);font-size:16px;line-height:1;padding:0 2px}
.tagedit input{flex:1;min-width:120px;padding:6px 8px;font-size:15px}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{border:1px dashed var(--line);background:none;color:var(--muted);border-radius:999px;padding:3px 10px;font:inherit;font-size:12.5px}
.thumb{width:100%;max-height:260px;object-fit:cover;object-position:top;border-radius:10px;border:1px solid var(--line);background:#fff;display:block}
.zoomable{position:relative;border:0;padding:0;background:none;display:block;width:100%;cursor:zoom-in}
.zoomable .zl{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.65);color:#fff;font-size:12.5px;font-weight:600;border-radius:999px;padding:5px 10px;display:flex;align-items:center;gap:5px}
.zoomable .zl svg{width:14px;height:14px}
#viewerHost .vw{position:fixed;inset:0;z-index:60;background:#111;display:flex;flex-direction:column}
#viewerHost .vbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;background:#1c1c1c;color:#fff}
#viewerHost .vbar .btn{background:#2c2c2c;color:#fff;border-color:#444;min-width:44px}
#viewerHost .vbar .pct{font-family:var(--f-num);font-size:13px;min-width:48px;text-align:center}
#viewerHost .vscroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom}
#viewerHost .vpages{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px;box-sizing:border-box}
#viewerHost .vpages img{display:block;background:#fff;max-width:none;height:auto;box-shadow:0 2px 10px rgba(0,0,0,.5)}
#viewerHost .vpg{position:relative;display:block}
#viewerHost .vtx{position:absolute;inset:0;user-select:text;-webkit-user-select:text;-webkit-touch-callout:default}
#viewerHost .vtx div{position:absolute;white-space:pre;color:transparent;transform-origin:0 0;line-height:1;font-family:Arial,sans-serif;cursor:text}
#viewerHost .vtx ::selection{background:rgba(30,120,255,.4);color:transparent}
#viewerHost .vmsg{color:#ccc;text-align:center;padding:40px 16px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:40;max-width:90%}
.scanwrap{display:flex;justify-content:center;margin:12px 0}
.scanwrap canvas{touch-action:none;border-radius:8px;max-width:100%;background:#000}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.thumbs .pg{display:flex;flex-direction:column;align-items:center;gap:2px}
.thumbs img{width:84px;height:118px;object-fit:cover;border:1px solid var(--line);border-radius:6px;background:#fff}
.catrow{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.catrow:last-of-type{border-bottom:0}
details summary{cursor:pointer}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><h1>Dokumente</h1><p id="sub">Briefe erfassen und wiederfinden</p></div>
    <button class="iconbtn" id="btnSettings" type="button" aria-label="Einstellungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span class="dot" id="settingsDot" hidden></span></button>
  </header>
  <div class="srow"><div class="search" role="search"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input type="text" inputmode="search" id="q" placeholder="Suchen: Absender, Schlagwort, Text, Aktenzeichen" aria-label="Dokumente durchsuchen" autocomplete="off" enterkeyhint="search"><button type="button" id="qClear" aria-label="Suche leeren" hidden>×</button></div>
  <button class="iconbtn" id="btnFilter" type="button" aria-label="Filter" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg><span class="fbadge" id="fBadge" hidden></span></button></div>
  <div id="importBar" class="hint" hidden></div>
  <section id="dueBox" class="due-box" hidden></section>
  <nav class="chips act" id="actChips" aria-label="Aktive Filter"></nav>
  <section class="list" id="list" aria-live="polite"><div class="empty">Dokumente werden geladen …</div></section>
</div>
<button class="fab" id="btnAdd" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>Eingang<span class="fabn" id="inboxN" hidden></span></button>
<div class="selbar" id="selBar" hidden><div class="in">
  <div class="selhead"><button type="button" class="btn link" data-sel="cancel">Abbrechen</button><span id="selCount">0 ausgewählt</span><button type="button" class="btn link" data-sel="all" id="selAll">Alle</button></div>
  <div class="selacts"><button type="button" class="btn" data-sel="status">Status</button><button type="button" class="btn" data-sel="cat">Kategorie</button><button type="button" class="btn" data-sel="share">Teilen</button><button type="button" class="btn danger" data-sel="del">Löschen</button></div>
</div></div>
<input type="file" id="pick" accept="image/*,application/pdf" hidden>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="pickBackup" accept="application/json,.json" hidden>
<div id="sheetHost"></div>
<div id="viewerHost"></div>
<div id="toast" class="toast" hidden></div>

<script src="parser.js"></script>
